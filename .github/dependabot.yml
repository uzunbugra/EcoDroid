# Monthly and grouped, so updates stay easy to review by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /engine/hvf
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      engine:
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: swift
    directory: /host/AvoKit
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      host:
        patterns: ["*"]
    commit-message:
      prefix: build

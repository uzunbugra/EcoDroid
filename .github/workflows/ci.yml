name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Docs: Markdown lint + link check (always runs)
  # ===========================================================================
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only EcoDroid's own docs; upstream Avo docs keep their own style.
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "*.md" ".github/**/*.md" "docs/security-audit.md"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "./*.md" "./docs/security-audit.md"
          fail: true

  # ===========================================================================
  # Rust engine: fmt, clippy, tests, licenses/advisories
  # Skipped until the engine workspace is in the tree.
  # ===========================================================================
  rust:
    name: Rust
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Detect Rust workspace
        id: detect
        run: |
          if [ -f engine/hvf/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.present == 'true'
        with:
          components: rustfmt, clippy

      # Upstream Avo code is not rustfmt-formatted; reformatting it would make
      # every upstream merge conflict. Only EcoDroid's own crates are checked.
      - name: Format (EcoDroid crates)
        if: steps.detect.outputs.present == 'true' && hashFiles('engine/eco/**/*.rs') != ''
        run: rustfmt --check --edition 2021 $(git ls-files 'engine/eco/*.rs')

      # Advisory for upstream code: warnings are shown but do not fail CI.
      - name: Clippy
        if: steps.detect.outputs.present == 'true'
        working-directory: engine/hvf
        run: cargo clippy --all-targets

      # GitHub's macOS runners are VMs without nested virtualization, so tests
      # that create a real VM (hv_vm_create → HV_UNSUPPORTED) cannot run there.
      # Run them locally: `cargo test -p avo-hvf-probe` and `cargo test pause_tests`.
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: engine/hvf
        env:
          AVO_VMM_MUTE: "1"
        run: cargo test --workspace --exclude avo-hvf-probe -- --skip machine::pause_tests

      - name: Licenses and advisories
        if: steps.detect.outputs.present == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: engine/hvf/Cargo.toml

  # ===========================================================================
  # macOS app: generate the Xcode project and run the test suite.
  # Skipped until the host app is in the tree.
  # ===========================================================================
  macos:
    name: macOS build
    # Avo needs the Xcode 27 toolchain; Xcode 26.x crashes on AvoKeymapUI.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect host app
        id: detect
        run: |
          if [ -f host/project.yml ] && [ -f Makefile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - name: Toolchain
        if: steps.detect.outputs.present == 'true'
        run: xcodebuild -version && swift --version

      - name: Install tools
        if: steps.detect.outputs.present == 'true'
        run: brew install xcodegen cmake ninja

      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.present == 'true'

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: make test

  # ===========================================================================
  # Single required check for branch rules
  # ===========================================================================
  ci-ok:
    name: CI OK
    if: always()
    needs: [docs, rust, macos]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'

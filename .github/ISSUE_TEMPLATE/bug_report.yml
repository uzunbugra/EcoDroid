name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: MacBook Pro M5 Pro, macOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EcoDroid version or commit
  - type: input
    id: app
    attributes:
      label: Android app or game (package name), if relevant
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text

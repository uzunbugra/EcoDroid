# cargo-deny policy for the Rust engine (engine/hvf). CI runs it on every PR.

[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
ignore = []

[licenses]
# Permissive licences only, compatible with Apache-2.0 / BSD-3-Clause.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
